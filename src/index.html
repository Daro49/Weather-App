<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="background">
      <div id="frame">
        <!-- Top Navigation Bar -->
        <div id="top">
          <div class="navbar">
            <div id="date">4.9.2025</div>
            <div id="selector_container">
              <div id="selector_text">Trencin</div>
            </div>
            <img id="minimize_button" src="../assets/night_minimize.png" alt="minimize">
            <img id="exit_button" src="../assets/night_exit.png" alt="exit">
          </div>
          <hr id="line">
        </div>

        <!-- Current Weather -->
        <div class="current_weather">
          <div class="main_day">Monday</div>
          <img class="main_img" src="../assets/question_mark.png" alt="today">
          <div class="main_temp">21.5°C</div>
        </div>

        <!-- Forecast -->
        <div class="forecast">
          <div class="day">
            <p class="f_day">Tuesday</p>
            <img class="forecast_img" src="../assets/question_mark.png" alt="day1">
            <p class="f_temp">20°C</p>
          </div>
          <div class="day">
            <p class="f_day">Wednesday</p>
            <img class="forecast_img" src="../assets/question_mark.png" alt="day2">
            <p class="f_temp">23°C</p>
          </div>
          <div class="day">
            <p class="f_day">Thursday</p>
            <img class="forecast_img" src="../assets/question_mark.png" alt="day3">
            <p class="f_temp">25°C</p>
          </div>
        </div>
      </div>

      <div id="dropdown_menu">
        <div class="dropdown_option" onclick="setCity(event)">
          <div class="dropdown_text">Trencin</div>
        </div>
        <div class="dropdown_option" onclick="setCity(event)">
          <div class="dropdown_text">Brno</div>
        </div>
      </div>
    </div>
  </body>
  <script src="./render.js"></script>
</html>
